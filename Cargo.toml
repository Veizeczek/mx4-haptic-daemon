[package]
name = "mx4-haptic-daemon"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Haptic feedback on clicks for the Logitech MX Master 4 (Windows and macOS)"
repository = "https://github.com/Veizeczek/mx4-haptic-daemon"
readme = "README.md"
keywords = ["logitech", "mx-master", "haptic", "hidpp", "mouse"]
categories = ["hardware-support"]
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
eframe = "0.29"
rdev = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.5", features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.5" }
windows = { version = "0.58.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_Foundation", "Win32_Globalization", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.52"
tray-icon = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
